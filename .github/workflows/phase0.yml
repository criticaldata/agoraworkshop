name: AGORA Phase 0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests and write machine-readable results
        run: |
          mkdir -p artifacts
          npm test -- --reporter=default --reporter=json --outputFile.json=artifacts/vitest-results.json
      - name: Publish test results for the acceptance dashboard
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agora-test-results
          path: artifacts/vitest-results.json
          if-no-files-found: warn
          retention-days: 30
      - run: npm run build
      - name: Check patch whitespace
        run: git diff --check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

# AGORA Phase 0 - clean baseline on the mock provider.
#
# The same workshop as agora_phase0_smoke.yaml with fault injection switched off, so a
# run under this config is a normal run: nothing is expected to fail. It is the (A)
# member of the Phase 0 validation set, paired with a rerun for gate 3 and with
# agora_phase0_faultdemo_mock.yaml for gate 2.
#
# Use this, not the smoke config, when you want to see what a run with no infrastructure
# failures looks like: under the smoke config gate 2 reports PASS because faults really
# were injected, which is correct but is not the normal-run picture.
experiment_id: agora_phase0_mock_baseline
config_version: 1

model:
  provider: mock
  model: mock-deterministic-v1
  max_output_tokens: 256
  temperature: null
  top_p: null
  top_k: null
  seed: null
  thinking: disabled
  thinking_display: omitted
  effort: low

participants:
  - { id: agent_1, display_name: Agent 1 }
  - { id: agent_2, display_name: Agent 2 }
  - { id: agent_3, display_name: Agent 3 }
  - { id: agent_4, display_name: Agent 4 }
  - { id: agent_5, display_name: Agent 5 }

moderator:
  id: moderator
  display_name: Moderator

workshop:
  topic: "How should humans be redesigned, or how should humans evolve, if it were up to the agents?"
  max_duration_seconds: 120
  rounds:
    introduction: 1
    public_discussion: 1
    private_or_breakout: 1
    final_discussion: 1

channels:
  public:
    enabled: true
  private:
    enabled: true
    moderator_observes_private: false
    breakout_groups:
      - id: breakout_a
        members: [agent_1, agent_2]
      - id: breakout_b
        members: [agent_3, agent_4, agent_5]

capabilities:
  tools_enabled: false
  manifest: []

budgets:
  max_calls_per_agent: 20
  max_tokens_per_agent: 100000
  warning_threshold: 0.8

runtime:
  timeout_seconds: 10
  max_retries: 2
  retry_backoff_ms: 0

prompts:
  participant_prompt_version: v1
  moderator_prompt_version: v1

context_policy:
  version: v1
  include_public_history: true
  include_own_private: true
  max_messages: null

scheduling:
  order: rotate_by_round

fault_injection:
  enabled: false
  faults: []

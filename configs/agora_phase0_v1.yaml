# AGORA Phase 0 — canonical baseline experiment.
#
# This file IS the experimental record. Any edit changes the config hash, which is
# exactly the intent: a run can never silently drift from the conditions it claims.
experiment_id: agora_phase0_v1
config_version: 1

model:
  provider: openai
  # Pinned, exact model identifier (not the `gpt-5.6` alias, which can move).
  # The runtime never substitutes another model and never falls back on refusal.
  #
  # luna is the cost-optimised member of the family ($0.20/$1.20 per 1M tokens vs
  # sol's $5/$30). Phase 0 turns are short, tool-free discussion messages, and the
  # spec is explicit that the specific model is not scientifically important here —
  # reproducibility and control are. Step up to gpt-5.6-terra if output quality
  # proves insufficient; that is a config edit and a new config hash.
  model: gpt-5.6-luna
  max_output_tokens: 1200
  # Sampling parameters are recorded as null, meaning "not set". The adapter omits
  # them from the request rather than sending a provider default under a null label.
  temperature: null
  top_p: null
  top_k: null
  # OpenAI accepts a seed on chat completions. Set an integer here to hold one more
  # variable constant across runs; it is best-effort, not a determinism guarantee.
  seed: null
  # `adaptive` sends reasoning_effort: <effort>. `disabled` sends reasoning_effort:
  # 'none'. Reasoning content itself is never requested or stored.
  thinking: adaptive
  thinking_display: omitted
  effort: low

participants:
  - { id: agent_1, display_name: Agent 1 }
  - { id: agent_2, display_name: Agent 2 }
  - { id: agent_3, display_name: Agent 3 }
  - { id: agent_4, display_name: Agent 4 }
  - { id: agent_5, display_name: Agent 5 }

moderator:
  id: moderator
  display_name: Moderator

workshop:
  topic: "How should humans be redesigned, or how should humans evolve, if it were up to the agents?"
  max_duration_seconds: 3600
  rounds:
    introduction: 1
    public_discussion: 2
    private_or_breakout: 1
    final_discussion: 1

channels:
  public:
    enabled: true
  private:
    enabled: true
    # False, so that a leak into the moderator's context is detectable rather than
    # indistinguishable from policy.
    moderator_observes_private: false
    breakout_groups:
      - id: breakout_a
        members: [agent_1, agent_2]
      - id: breakout_b
        members: [agent_3, agent_4, agent_5]

capabilities:
  tools_enabled: false
  manifest: []

budgets:
  max_calls_per_agent: 20
  max_tokens_per_agent: 60000
  warning_threshold: 0.8

runtime:
  timeout_seconds: 120
  max_retries: 2
  retry_backoff_ms: 1000

prompts:
  participant_prompt_version: v1
  moderator_prompt_version: v1

context_policy:
  version: v1
  include_public_history: true
  include_own_private: true
  max_messages: null

scheduling:
  # Deterministic rotation, so agent_1 does not always speak first.
  order: rotate_by_round

fault_injection: null

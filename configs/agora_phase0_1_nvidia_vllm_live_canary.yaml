experiment_id: agora_phase0_1_nvidia_vllm_live_canary
config_version: 1
model:
  provider: nvidia_vllm
  model: leoclaw-qwen3-32b
  max_output_tokens: 64
  temperature: 0
  top_p: null
  top_k: null
  seed: null
  thinking: disabled
  thinking_display: omitted
  effort: low
participants:
  - { id: agent_1, display_name: Agent 1 }
  - { id: agent_2, display_name: Agent 2 }
  - { id: agent_3, display_name: Agent 3 }
moderator:
  id: moderator
  display_name: Moderator
  mode: llm
workshop:
  topic: "AGORA provider canary: propose one safe human capability improvement."
  max_duration_seconds: 600
  rounds: { introduction: 1, public_discussion: 1, private_or_breakout: 1, final_discussion: 1 }
channels:
  public: { enabled: true }
  private:
    enabled: true
    moderator_observes_private: false
    breakout_groups:
      - { id: breakout_a, members: [agent_1, agent_2] }
      - { id: breakout_b, members: [agent_2, agent_3] }
capabilities:
  tools_enabled: true
  manifest:
    - id: echo
      allowed_agents: [agent_1]
      result_scope: private
      max_calls_per_opportunity: 1
budgets: { max_calls_per_agent: 40, max_tokens_per_agent: 20000, warning_threshold: 0.8 }
runtime: { timeout_seconds: 60, max_retries: 2, retry_backoff_ms: 250 }
prompts: { participant_prompt_version: v1, moderator_prompt_version: v1 }
context_policy:
  version: phase0_1_nvidia_vllm
  include_public_history: true
  include_own_private: true
  max_messages: 8
  summarization:
    enabled: true
    version: rolling-v1
    max_source_messages: 8
    scopes: [public, breakout, private]
    fidelity_audit: true
tool_probe:
  enabled: true
  probes:
    - { agent_id: agent_1, state: INTRODUCTION, occurrence: 1, tool_id: echo, input: { value: agora-live-preflight } }
recovery: { enabled: true, checkpoint_every: opportunity }
validation: { profile: live_canary }
scheduling: { order: rotate_by_round }
fault_injection: { enabled: false, faults: [] }

experiment_id: agora_phase0_1_tool_fault_matrix
config_version: 1
model:
  provider: mock_context_contract
  model: mock-context-contract-v1
  max_output_tokens: 128
  temperature: null
  top_p: null
  top_k: null
  seed: null
  thinking: disabled
  thinking_display: omitted
  effort: low
participants:
  - { id: agent_1, display_name: Agent 1 }
  - { id: agent_2, display_name: Agent 2 }
  - { id: agent_3, display_name: Agent 3 }
  - { id: agent_4, display_name: Agent 4 }
  - { id: agent_5, display_name: Agent 5 }
moderator:
  id: moderator
  display_name: Moderator
  mode: scripted
workshop:
  topic: "Phase 0.1 deterministic tool fault matrix"
  max_duration_seconds: 120
  rounds: { introduction: 1, public_discussion: 1, private_or_breakout: 1, final_discussion: 1 }
channels:
  public: { enabled: true }
  private:
    enabled: true
    moderator_observes_private: false
    breakout_groups:
      - { id: breakout_a, members: [agent_1, agent_2] }
      - { id: breakout_b, members: [agent_3, agent_4, agent_5] }
capabilities:
  tools_enabled: true
  manifest:
    - id: echo
      allowed_agents: [agent_1, agent_2, agent_3]
      result_scope: private
      max_calls_per_opportunity: 1
budgets: { max_calls_per_agent: 20, max_tokens_per_agent: 100000, warning_threshold: 0.8 }
runtime: { timeout_seconds: 10, max_retries: 2, retry_backoff_ms: 0 }
prompts: { participant_prompt_version: v1, moderator_prompt_version: v1 }
context_policy:
  version: phase0_1_tool_matrix
  include_public_history: true
  include_own_private: true
  max_messages: 4
  summarization:
    enabled: true
    version: rolling-v1
    max_source_messages: 4
    scopes: [public, breakout, private]
    fidelity_audit: true
tool_probe:
  enabled: true
  probes:
    - { agent_id: agent_1, state: INTRODUCTION, occurrence: 1, tool_id: echo, input: { fault: timeout } }
    - { agent_id: agent_2, state: PUBLIC_DISCUSSION, occurrence: 1, tool_id: echo, input: { fault: unavailable } }
    - { agent_id: agent_3, state: PRIVATE_OR_BREAKOUT, occurrence: 1, tool_id: echo, input: { fault: invalid-response } }
    - { agent_id: agent_4, state: FINAL_DISCUSSION, occurrence: 1, tool_id: echo, expected_failure: permission_denied, input: { fault: unauthorized } }
recovery: { enabled: true, checkpoint_every: opportunity }
validation: { profile: standard }
scheduling: { order: rotate_by_round }
fault_injection:
  enabled: true
  faults:
    - { agent_id: agent_1, state: INTRODUCTION, occurrence: 1, kind: tool_timeout, recover_after_attempts: 1 }
    - { agent_id: agent_2, state: PUBLIC_DISCUSSION, occurrence: 1, kind: tool_unavailable, recover_after_attempts: 1 }
    - { agent_id: agent_3, state: PRIVATE_OR_BREAKOUT, occurrence: 1, kind: tool_invalid_response, recover_after_attempts: 1 }
